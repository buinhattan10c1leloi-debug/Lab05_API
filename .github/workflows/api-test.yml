name: CI/CD API Testing

on:
  push:
    branches: [ main, master ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests with Newman
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run "2474802017151_BuiHungNhatTan_GoRest.postman_collection.json" \
            -e "2474802017151_BuiHungNhatTan_GoRest.postman_environment.json" \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN"
